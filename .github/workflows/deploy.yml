name: Verifica e pubblica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-content.txt

      - name: Installa le dipendenze
        run: |
          npm ci
          pip install -r requirements-content.txt

      - name: Esegue davvero esempi, esercizi, kata e progetti
        run: python scripts/verify_content.py

      - name: Gradualità del percorso
        run: python scripts/check_order.py

      - name: Genera i contenuti
        run: npm run content

      - name: Test del motore
        run: npm test

      - name: Build (tipi, bundle, budget di peso)
        run: npm run build

      # L'app vera sta su Cloudflare (collegato al repository, vedi README). Al vecchio indirizzo GitHub Pages
      # va la pagina di trasloco quando la variabile PYCOIL_URL del repository contiene il nuovo indirizzo;
      # finché è vuota, lì resta una copia dell'app (senza notifiche).
      - name: Vecchio indirizzo GitHub Pages
        env:
          PYCOIL_URL: ${{ vars.PYCOIL_URL || 'https://pycoil.e-franchini99.workers.dev/' }}
        run: |
          if [ -n "$PYCOIL_URL" ]; then
            node scripts/build-moved.mjs pages
          else
            PYCOIL_BASE=/pycoil/ npx vite build --outDir pages --emptyOutDir
            touch pages/.nojekyll
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: |
            dist
            pages
          retention-days: 1

  # Pubblica il vecchio indirizzo sul branch gh-pages (GitHub Pages) e una copia dei soli contenuti
  # sul branch content, che jsDelivr usa come riserva (vedi src/engine/content.ts).
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - name: Pubblica sui branch gh-pages e content
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            cd "$1"
            git init -q -b "$2"
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Pubblicazione di ${GITHUB_SHA::7}"
            git push -qf "$remote" "$2"
            cd - > /dev/null
          }
          cp -r dist/content content
          publish pages gh-pages
          publish content content
