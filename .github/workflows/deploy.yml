name: Verifica e pubblica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-content.txt

      - name: Installa le dipendenze
        run: |
          npm ci
          pip install -r requirements-content.txt

      - name: Esegue davvero esempi, esercizi, kata e progetti
        run: python scripts/verify_content.py

      - name: Genera i contenuti
        run: npm run content

      - name: Test del motore
        run: npm test

      - name: Build (tipi, bundle, budget di peso)
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 1

  # Pubblica l'app sul branch gh-pages (servito da GitHub Pages) e una copia
  # dei soli contenuti sul branch content, che jsDelivr usa come riserva
  # se Pages non risponde (vedi src/engine/content.ts).
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Pubblica sui branch gh-pages e content
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            cd "$1"
            git init -q -b "$2"
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Pubblicazione di ${GITHUB_SHA::7}"
            git push -qf "$remote" "$2"
            cd - > /dev/null
          }
          cp -r dist/content content
          touch dist/.nojekyll
          publish dist gh-pages
          publish content content
